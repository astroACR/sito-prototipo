<style>
/* =========================================================
   1. Tokens de diseño
   ========================================================= */
:root{
  --bg:#F6F5F1; --ink:#15181D; --ink2:#4B5160; --line:#E2E0D8; --card:#FFFFFF;
  --yellow:#F2B705; --red:#B42318; --red-bg:#FDECEA; --red-ink:#7A1A12;
  --green:#1E7B45; --green-bg:#E3F2E8; --blue:#1F4FB3; --blue-bg:#E3EAF9;
  --amber-ink:#8A5A00; --warn-bg:#FFF7DB; --warn-ink:#5C3D00;
  --r-card:16px; --r-btn:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --gx:16px;
}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:#E7E5DE;color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  overflow:hidden;
}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus{outline:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* =========================================================
   2. Contenedor de la app (máx. 430 px, 100dvh, áreas seguras)
   ========================================================= */
#app{
  position:relative;max-width:430px;margin:0 auto;
  height:100vh;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
@media (min-width:431px){#app{box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(21,24,29,.08)}}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.top{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:64px;
  padding:calc(var(--sat) + 8px) calc(var(--gx) + var(--sar)) 8px calc(var(--gx) + var(--sal));
}
.scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:4px calc(var(--gx) + var(--sar)) 24px calc(var(--gx) + var(--sal));
}
.foot{
  flex:none;display:flex;flex-direction:column;gap:10px;background:var(--bg);
  border-top:1px solid var(--line);
  padding:12px calc(var(--gx) + var(--sar)) calc(12px + var(--sab)) calc(var(--gx) + var(--sal));
}
.foot.has-nav{padding-bottom:0}

/* Transiciones entre pantallas (150–200 ms) */
.enter-fwd{animation:inFwd .18s ease-out}
.enter-back{animation:inBack .18s ease-out}
.enter-fade{animation:inFade .16s ease-out}
@keyframes inFwd{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* =========================================================
   3. Tipografía y piezas comunes
   ========================================================= */
.brand{
  font-size:22px;font-weight:800;letter-spacing:.02em;line-height:44px;min-height:44px;
  display:inline-block;padding-right:8px;cursor:default;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.meta{font-size:15px;color:var(--ink2);text-align:right;line-height:1.25}
.meta b{color:var(--ink);font-weight:700}
.h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.sub{font-size:16px;color:var(--ink2);margin-top:6px}
.hello{font-size:17px;color:var(--ink2);margin-top:16px}
.section-t{font-size:17px;font-weight:800;margin:24px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card)}
.ic{flex:none;display:block}
.small{font-size:15px;color:var(--ink2)}
.center{text-align:center}

/* Botones */
.btn{
  appearance:none;-webkit-appearance:none;border:0;margin:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  min-height:60px;padding:0 20px;border-radius:var(--r-btn);
  font-size:17px;font-weight:800;line-height:1.2;text-decoration:none;text-align:center;
  background:transparent;color:var(--ink);transition:transform .08s ease;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--yellow);color:var(--ink)}
.btn-danger{background:var(--red);color:#fff}
.btn-outline{background:var(--card);border:2px solid var(--ink);min-height:56px}
.btn[aria-disabled="true"]{background:var(--line);color:var(--ink2);border-color:var(--line)}
.btn[aria-disabled="true"]:active{transform:none}
.link{
  display:flex;align-items:center;justify-content:center;min-height:44px;
  font-size:16px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;
  background:none;border:0;cursor:pointer;width:100%;
}
.iconbtn{
  appearance:none;border:2px solid var(--line);background:var(--card);border-radius:999px;
  width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;
}
.iconbtn:active{background:var(--line)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 12px;border-radius:999px;font-size:15px;font-weight:700}
.chip-blue{background:var(--blue-bg);color:var(--blue)}
.chip-amber{background:var(--warn-bg);color:var(--amber-ink)}
.chip-green{background:var(--green-bg);color:var(--green)}
.chip-red{background:var(--red-bg);color:var(--red-ink)}

/* Íconos con fondo de color según estado */
.tile{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.tile-blue{background:var(--blue);color:#fff}
.tile-amber{background:var(--yellow);color:var(--ink)}
.tile-green{background:var(--green);color:#fff}
.tile-dark{background:var(--ink);color:var(--yellow)}
.st-blue{color:var(--blue)} .st-amber{color:var(--amber-ink)} .st-green{color:var(--green)}

/* Casillas (24 px en consentimiento, 26 px en checklist) */
.cbx{
  appearance:none;-webkit-appearance:none;margin:0;flex:none;cursor:pointer;
  width:24px;height:24px;border:2px solid var(--ink2);border-radius:6px;background:var(--card);
  display:inline-block;position:relative;
}
.cbx.lg{width:26px;height:26px;border-radius:7px}
.cbx:checked{background:var(--ink);border-color:var(--ink)}
.cbx:checked::after{
  content:"";position:absolute;left:50%;top:45%;width:6px;height:12px;
  border:solid var(--yellow);border-width:0 3px 3px 0;transform:translate(-50%,-50%) rotate(45deg);
}
.cbx:disabled{opacity:.75;cursor:default}
.cbx:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Aviso de seguridad */
.warn{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-card);padding:14px 16px;font-size:16px;font-weight:600;margin-top:14px}

/* =========================================================
   4. Pantalla 1 · Consentimiento
   ========================================================= */
.shield{width:60px;height:60px;border-radius:18px;background:var(--ink);color:var(--yellow);display:flex;align-items:center;justify-content:center;margin:2px 0 14px}
.pcard{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;margin-top:10px}
.pcard .pi{width:44px;height:44px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.pcard p{font-size:16px;color:var(--ink2)}
.pcard b{color:var(--ink);display:block;font-size:17px;margin-bottom:2px}
.agree{display:flex;gap:14px;align-items:center;min-height:52px;padding:4px 2px;font-size:16px;font-weight:600;cursor:pointer}

/* =========================================================
   5. Pantalla 2 · Mis tareas
   ========================================================= */
.offline{display:flex;gap:12px;align-items:flex-start;background:var(--ink);color:#fff;border-radius:var(--r-card);padding:14px 16px;font-size:16px}
.offline .ic{color:var(--yellow);margin-top:1px}
.offline b{font-weight:800}
.progress{margin-top:16px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s ease}
.prow{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:var(--ink2);margin-top:8px}
.prow b{color:var(--ink)}
.tasks{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.task{
  appearance:none;width:100%;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:14px;padding:14px 12px 14px 14px;min-height:84px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
}
.task:active{background:#FBFAF7}
.task .tx{flex:1;min-width:0}
.task .tt{font-size:17px;font-weight:800;line-height:1.25}
.task .tl{font-size:15px;color:var(--ink2);margin-top:2px}
.task .ts{font-size:15px;font-weight:700;margin-top:4px}
.task .chev{color:var(--ink2)}
.nav{display:flex;margin:0 calc(-1 * var(--gx));border-top:1px solid var(--line);padding-bottom:var(--sab);background:var(--card)}
.nav button{
  flex:1;appearance:none;border:0;background:none;cursor:pointer;min-height:60px;padding:8px 4px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:14px;font-weight:600;color:var(--ink2);position:relative;
}
.nav button[aria-current="page"]{color:var(--ink);font-weight:800}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--yellow)}
.nav .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:800;line-height:20px;text-align:center}

/* =========================================================
   6. Pantalla 3 · Detalle de tarea
   ========================================================= */
.dmeta{font-size:16px;color:var(--ink2);margin-top:8px}
.steps{display:flex;margin:22px 0 4px;list-style:none;padding:0}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:14px;font-weight:600;color:var(--ink2);text-align:center}
.steps li::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.cur::before{background:var(--green)}
.steps .dot{position:relative;z-index:1;width:32px;height:32px;border-radius:999px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--ink2)}
.steps li.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.steps li.cur .dot{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
.steps li.cur{color:var(--ink);font-weight:800}
.check{padding:6px 16px 8px;margin-top:18px}
.check h2{font-size:17px;font-weight:800;padding:12px 0 6px;display:flex;justify-content:space-between;gap:8px}
.check h2 span{font-weight:700;color:var(--ink2);font-size:15px}
.citem{display:flex;align-items:center;gap:14px;min-height:56px;font-size:17px;font-weight:600;cursor:pointer;border-top:1px solid var(--line)}
.citem:first-of-type{border-top:0}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin-top:14px;font-size:16px}

/* =========================================================
   7. Pantalla 4 · Evidencia
   ========================================================= */
.htitle{flex:1;min-width:0;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo{
  position:relative;height:330px;border-radius:var(--r-card);overflow:hidden;
  background:#22262E;color:#C9CDD6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
}
.photo .grid{position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(to right,transparent calc(33.333% - 1px),rgba(255,255,255,.18) calc(33.333% - 1px),rgba(255,255,255,.18) 33.333%,transparent 33.333%,transparent calc(66.666% - 1px),rgba(255,255,255,.18) calc(66.666% - 1px),rgba(255,255,255,.18) 66.666%,transparent 66.666%),
   linear-gradient(to bottom,transparent calc(33.333% - 1px),rgba(255,255,255,.18) calc(33.333% - 1px),rgba(255,255,255,.18) 33.333%,transparent 33.333%,transparent calc(66.666% - 1px),rgba(255,255,255,.18) calc(66.666% - 1px),rgba(255,255,255,.18) 66.666%,transparent 66.666%);
}
.photo p{font-size:16px;position:relative}
.photo .pill{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700}
.saved{padding:4px 16px;margin-top:14px}
.saved .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;font-size:16px;color:var(--ink2)}
.saved .row + .row{border-top:1px solid var(--line)}
.saved b{color:var(--ink)}
.queue{display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;gap:12px;align-items:center;padding:12px 14px;min-height:64px}
.qrow .tx{flex:1;min-width:0}
.qrow .tt{font-size:16px;font-weight:800}
.qrow .tl{font-size:15px;color:var(--ink2)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px;color:var(--ink2)}
.empty b{color:var(--ink);font-size:17px}

/* =========================================================
   8. Pantalla 5 · Reportar incidente
   ========================================================= */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.type{
  appearance:none;cursor:pointer;height:112px;border-radius:var(--r-card);
  border:2px solid var(--line);background:var(--card);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;
  font-size:16px;font-weight:800;line-height:1.2;text-align:center;
}
.type .ic{color:var(--red)}
.type[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.type[aria-pressed="true"] .ic{color:var(--yellow)}
.addphoto{margin-top:14px}
.addphoto.ok{border-color:var(--green);color:var(--green)}
.switchrow{
  appearance:none;width:100%;cursor:pointer;text-align:left;margin-top:14px;
  display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:72px;

}
.switchrow .tx{flex:1}
.switchrow b{display:block;font-size:17px;font-weight:800}
.switchrow span{font-size:15px;color:var(--ink2)}
.sw{flex:none;width:56px;height:32px;border-radius:999px;background:#9AA0AC;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
[aria-checked="true"] .sw{background:var(--green)}
[aria-checked="true"] .sw::after{transform:translateX(24px)}

/* =========================================================
   9. Pantalla 6 · Panel del supervisor
   ========================================================= */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{padding:12px 10px;min-height:88px}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.kpi span{display:block;font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.2}

.alert{display:flex;gap:12px;align-items:center;background:var(--red-bg);color:var(--red-ink);border-radius:var(--r-card);padding:14px 14px 14px 16px;margin-top:14px;border:1px solid #F4C7C1}
.alert .tx{flex:1;min-width:0;font-size:15px}
.alert b{display:block;font-size:17px;font-weight:800}
.alert .act{appearance:none;border:0;cursor:pointer;min-height:48px;padding:0 16px;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:16px}
.vrow{display:flex;gap:12px;align-items:center;padding:12px}
.thumb{width:56px;height:56px;border-radius:12px;background:#22262E;color:#C9CDD6;display:flex;align-items:center;justify-content:center;flex:none}
.vrow .tx{flex:1;min-width:0}
.vrow .tt{font-size:16px;font-weight:800;line-height:1.25}
.vrow .tl{font-size:15px;color:var(--ink2)}
.vbtn{appearance:none;cursor:pointer;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.vbtn.ok{background:var(--green);color:#fff;border:0}
.vbtn.no{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.crew{padding:6px 16px}
.crow{padding:12px 0}
.crow + .crow{border-top:1px solid var(--line)}
.crow .lbl{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:600;margin-bottom:8px}
.crow .lbl b{font-weight:800}

/* =========================================================
   10. Panel inferior (política), aviso breve y punto de prueba
   ========================================================= */
.backdrop{position:absolute;inset:0;background:rgba(21,24,29,.45);z-index:40;animation:inFade .16s ease-out}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--card);
  border-radius:22px 22px 0 0;padding:10px calc(20px + var(--sar)) calc(16px + var(--sab)) calc(20px + var(--sal));

}
@keyframes sheetIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:12px}
.sheet ol{margin:0 0 18px;padding-left:22px;font-size:16px;color:var(--ink2);display:flex;flex-direction:column;gap:10px}
.sheet li::marker{color:var(--ink);font-weight:800}

#toast{
  position:absolute;left:16px;right:16px;z-index:50;display:flex;gap:10px;align-items:center;
  background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;
  box-shadow:0 8px 24px rgba(21,24,29,.25);opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .16s ease,transform .16s ease;
}
#toast.show{opacity:1;transform:none}
#toast .ic{color:var(--yellow)}

#toast.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid #F0D98A}

#sdot{position:absolute;top:calc(var(--sat) + 3px);right:calc(var(--sar) + 3px);width:8px;height:8px;border-radius:50%;background:rgba(75,81,96,.45);z-index:60;display:none;pointer-events:none}
#sdot.on{display:block}
#sdot.done{background:rgba(30,123,69,.75)}
.corner{position:absolute;top:var(--sat);right:var(--sar);width:44px;height:44px;z-index:5;-webkit-touch-callout:none}

/* =========================================================
   11. Modo encuestador (solo lo ve quien aplica la encuesta)

#survey{

#survey .box{background:#1B1F26;border:1px solid #2B313B;border-radius:14px;padding:12px}

  width:100%;min-height:48px;border-radius:12px;border:1px solid #3A414D;background:#0F1115;color:#fff;
  padding:0 14px;font-size:18px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
}
#survey .live{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
#survey .live div{background:#0F1115;border-radius:10px;padding:8px 10px}
#survey .live b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
#survey .live span{font-size:12px;color:#A9AEB8}
#survey .test{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #2B313B}
#survey .test:first-child{border-top:0;padding-top:0}
#survey .test .tx{flex:1;min-width:0}
#survey .test b{font-size:15px}
#survey .test p{font-size:14px;color:#C9CDD6}
#survey .saved-v{font-size:13px;color:#7FD3A0;margin-top:2px}
#survey table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
#survey th,#survey td{padding:6px 4px;border-bottom:1px solid #2B313B;text-align:center}
#survey th:first-child,#survey td:first-child{text-align:left}
#survey textarea{width:100%;min-height:110px;margin-top:8px;border-radius:10px;border:1px solid #3A414D;background:#0F1115;color:#EDECE7;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px}
#survey .log{margin:8px 0 0;padding-left:18px;font-size:13px;color:#C9CDD6;max-height:120px;overflow:auto}
#survey .msg{min-height:20px;font-size:14px;color:#F2B705;margin-top:8px}
#survey .tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:#2B313B;color:#EDECE7}
#survey .tag.done{background:#1E7B45;color:#fff}

const STATUS = {

/* =========================================================

   ========================================================= */
const view = document.getElementById('view');

const nav = { stack:[], pendingRoot:null, hist:true };

  if (state.role==='supervisor') return {screen:'supervisor', params:{}};

  if (!nav.hist) return;

  const entry = {screen:screen, params:params||{}, idx:nav.stack.length};

  const idx = Math.max(0, nav.stack.length-1);

  const st = e.state;
  if (!st || typeof st.idx!=='number' || !SCREENS[st.screen]) { const r=rootEntry(); nav.stack=[{screen:r.screen,params:{},idx:0}]; pushHist(nav.stack[0], true); show(nav.stack[0], 'back'); return; }
  const dir = st.idx < cur.idx ? 'back' : 'fwd';
  nav.stack.length = st.idx; nav.stack[st.idx] = st;
  show(st, dir);
});

/* Dibuja una pantalla completa */
function show(entry, dir){
  closeSheet(true);
  cur = entry;
  view.innerHTML = SCREENS[entry.screen](entry.params||{});
  const scr = view.firstElementChild;
  if (dir && !reduceMotion && scr) scr.classList.add('enter-'+dir);
  const h = view.querySelector('[data-focus]');
  if (h) { try { h.focus({preventScroll:true}); } catch(e){ h.focus(); } }
}
/* Redibuja la pantalla actual sin animación (conserva scroll y foco) */
function refresh(){
  const sc = view.querySelector('.scroll'); const top = sc ? sc.scrollTop : 0;
  const ae = document.activeElement;
  const key = ae && ae.dataset && ae.dataset.act ? [ae.dataset.act, ae.dataset.arg||''] : null;
  view.innerHTML = SCREENS[cur.screen](cur.params||{});
  const sc2 = view.querySelector('.scroll'); if (sc2) sc2.scrollTop = top;
  if (key) {
    const el = view.querySelector('[data-act="'+key[0]+'"]'+(key[1]?'[data-arg="'+key[1]+'"]':''));
    if (el) { try { el.focus({preventScroll:true}); } catch(e){} }
  }
}

function tabGo(screen, params){ if (cur.idx===0) go(screen, params); else replaceTop(screen, params); }
function resetIncident(){ state.incident = {type:null, photo:false, anon:true}; }

const actions = {
  'consent-accept': function(){
    if (!state.consentChecked) { toast('Marca la casilla para continuar', 'warn'); return; }
    state.consented = true; home();
  },
  'policy-open': function(){ openPolicy(); },
  'policy-close': function(){ closeSheet(); },
  'open-task': function(id){ go('detail', {id:id}); },
  'nav': function(where){
    if (where==='tasks') { if (cur.screen!=='tasks') home(); }
    else if (where==='pending') { if (!(cur.screen==='evidence' && cur.params.review)) tabGo('evidence', {review:true}); }
    else if (where==='profile') { tabGo('consent', {profile:true}); }
  },
  'incident-open': function(){ resetIncident(); go('incident'); },
  'problem': function(){ resetIncident(); go('incident'); },
  'back': function(){ back(); },
  'finish-photo': function(){
    const t = task(cur.params.id);
    if (!t.checks.every(Boolean)) { toast('Completa el checklist antes de terminar', 'warn'); return; }
    state.draftTime = nowHM();
    go('evidence', {id:t.id});
  },
  'finish-task': function(){
    const t = task(cur.params.id);
    if (!t || t.status!=='todo') return;
    t.status = 'pending'; t.savedAt = state.draftTime || nowHM();
    state.lastEvidence = {taskId:t.id, time:t.savedAt};
    survey.detect('P1', t.id==='t1');
    home('Tarea guardada', 'ok');
  },
  'retake': function(){ back(); },
  'inc-type': function(k){ state.incident.type = k; refresh(); },
  'inc-photo': function(){ state.incident.photo = true; refresh(); },
  'inc-anon': function(){ state.incident.anon = !state.incident.anon; refresh(); },
  'inc-send': function(){
    const i = state.incident;
    if (!i.type) { toast('Elige qué pasó antes de enviar', 'warn'); return; }
    state.incidents.push({type:i.type, photo:i.photo, anon:i.anon, time:nowHM()});
    survey.detect('P2', i.type==='caida' && i.anon);
    home('Reporte guardado. Se enviará apenas haya señal', 'ok');
  },
  'sup-attend': function(){ state.sup.alert = 'attending'; refresh(); toast('Incidente en atención', 'ok'); },
  'sup-ok': function(){
    if (state.sup.verify) return;
    state.sup.verify = 'ok'; state.sup.closed++; state.sup.toVerify--;
    survey.detect('P4', true); refresh(); toast('Tarea verificada', 'ok');
  },
  'sup-fix': function(){
    if (state.sup.verify) return;
    state.sup.verify = 'fix'; state.sup.toVerify--;
    survey.detect('P4', true); refresh(); toast('Corrección pedida');
  }
};

    P5:{who:'Supervisor', text:'Encuentre el incidente y diga dónde ocurrió', auto:false, full:false}
  };
  const COLS = ['ID','PR','P1_exito','P1_seg','P1_toques','P1_errores','P2_exito','P2_seg','P2_toques','P2_errores','P3_exito','P3_seg','P4_exito','P4_seg','P5_exito','P5_seg'];
  const ROLES = [['worker-consent','Trabajador · consentimiento'],['worker-tasks','Trabajador · tareas'],['supervisor','Supervisor']];
  let data = {results:{}, cfg:{role:'worker-consent', pid:''}};   // respaldo en memoria
  let storageOK = true;
  let active = null;      // prueba en curso
  let isOpen = false, ticker = null, armed = {};
  const panel = document.getElementById('survey');
  const dot = document.getElementById('sdot');

  /* --- Persistencia (localStorage con try/catch; si falla, queda en memoria) --- */
  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); data.results = d.results || {}; data.cfg = Object.assign(data.cfg, d.cfg || {}); }
    } catch(e){ storageOK = false; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(data)); storageOK = true; } catch(e){ storageOK = false; }
  }

  /* --- Almacenamiento persistente: pide al navegador no borrar los resultados por falta de espacio --- */
  let persisted = null;   // null = no disponible, true/false = respuesta del navegador
  function requestPersist(){
    try {
      if (!navigator.storage || !navigator.storage.persist) return;
      const ask = navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false);
      ask.then(function(p){ return p ? true : navigator.storage.persist(); })
        .then(function(p){ persisted = !!p; updateEnv(); })
        .catch(function(){});
    } catch(e){}
  }

  /* --- Cómo se abrió la app: en iPhone, Safari y el ícono de inicio guardan datos por separado --- */
  const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  function launchMode(){
    if (location.protocol==='file:') return 'file';
    const standalone = navigator.standalone===true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    return standalone ? 'app' : 'browser';
  }
  function envHTML(){
    const mode = launchMode();
    let t = mode==='app' ? 'Abierta desde el <b>ícono de inicio</b>.'
          : mode==='file' ? '<b>Abierta como archivo.</b> Los resultados pueden no guardarse: usa la dirección web.'
          : 'Abierta en el <b>navegador</b>.';
    if (mode==='browser' && IS_IOS) t += ' En iPhone, Safari y el ícono de inicio guardan resultados por separado: usa siempre la misma vía (mejor el ícono).';
    t += ' Almacenamiento persistente: '+(persisted===null ? 'no disponible' : persisted ? 'sí' : 'no')+'.';
    return t;
  }
  function updateEnv(){ const el = panel.querySelector('#s-env'); if (el) el.innerHTML = envHTML(); }

  /* --- Utilidades --- */
  const now = function(){ return (window.performance && performance.now) ? performance.now() : Date.now(); };
  function elapsed(){ if (!active || active.t0==null) return 0; return ((active.tEnd!=null ? active.tEnd : now()) - active.t0)/1000; }
  const r1 = function(x){ return Math.round(x*10)/10; };
  const fmt = function(x){ return String(r1(x).toFixed(1)).replace('.', ','); };
  const fmtEx = function(v){ return v===0.5 ? '0,5' : String(v); };
  function screenLabel(){
    const p = cur.params || {};
    let s;
    switch(cur.screen){
      case 'consent': s = p.profile ? 'Mi perfil (consentimiento)' : 'Consentimiento'; break;
      case 'tasks': s = 'Mis tareas'; break;
      case 'detail': s = 'Detalle · '+((task(p.id)||{}).title||''); break;
      case 'evidence': s = p.review ? 'Por enviar' : 'Evidencia · '+((task(p.id)||{}).title||''); break;
      case 'incident': s = 'Reportar incidente'; break;
      case 'supervisor': s = 'Panel supervisor'; break;
      default: s = cur.screen;
    }
    return sheetOpen ? s+' · Política' : s;
  }
  function actLabel(el){
    const a = el.getAttribute('aria-label') || el.textContent || '';
    return a.replace(/\s+/g,' ').trim().slice(0,48) || el.dataset.act || '?';
  }

  /* --- Clasificación de cada toque: 'ok' (hacia el objetivo), 'error' (desvío) o 'neutral' --- */
  function classify(act, arg){
    const s = cur.screen, p = cur.params || {};
    if (['policy-open','policy-close','consent-check','consent-accept'].indexOf(act)>=0 || sheetOpen) return 'neutral';
    if (active.id==='P1'){
      const onPath = s==='consent' || s==='tasks' || (s==='detail' && p.id==='t1') || (s==='evidence' && !p.review && p.id==='t1');
      if (!onPath) return 'neutral';            // ya se contó el desvío al salir del camino
      switch(act){
        case 'open-task': return arg==='t1' ? 'ok' : 'error';
        case 'check': return 'ok';
        case 'finish-photo': return task('t1').checks.every(Boolean) ? 'ok' : 'error';
        case 'finish-task': return 'ok';
        case 'nav': return arg==='tasks' ? 'neutral' : 'error';
        default: return 'error';               // atrás, repetir foto, incidente, problema…
      }
    }
    if (active.id==='P2'){
      const onPath = s==='consent' || s==='tasks' || s==='incident';
      if (!onPath) return 'neutral';
      switch(act){
        case 'incident-open': return 'ok';
        case 'inc-type': return arg==='caida' ? 'ok' : 'error';
        case 'inc-photo': return 'neutral';
        case 'inc-anon': return state.incident.anon ? 'error' : 'ok';
        case 'inc-send': return (state.incident.type==='caida' && state.incident.anon) ? 'ok' : 'error';
        case 'nav': return arg==='tasks' ? 'neutral' : 'error';
        default: return 'error';
      }
    }
    if (active.id==='P4'){
      if (s!=='supervisor') return 'neutral';
      return (act==='sup-ok' || act==='sup-fix') ? 'ok' : 'error';
    }
    return 'neutral';
  }

  /* --- Conteo de toques (pointerdown en elementos interactivos) --- */
  app.addEventListener('pointerdown', function(e){
    if (!active || active.done || active.t0==null || e.isPrimary===false) return;
    const el = e.target.closest('[data-act]') || e.target.closest('button,a,input,label,[role="switch"]');
    if (!el || !app.contains(el)) return;
    active.taps++;
    const verdict = classify(el.dataset.act || '', el.dataset.arg);
    if (verdict==='error') active.errors.push({src:'auto', screen:screenLabel(), act:actLabel(el), t:r1(elapsed())});
  }, true);

  /* --- Toque largo de 2 s sobre el logo o la esquina superior derecha --- */
  let lpTimer = null, lpX = 0, lpY = 0;
  app.addEventListener('pointerdown', function(e){
    const el = e.target.closest('[data-logo]'); if (!el) return;
    lpX = e.clientX; lpY = e.clientY;
    clearTimeout(lpTimer);
    lpTimer = setTimeout(function(){ lpTimer = null; open(); }, 2000);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){ app.addEventListener(t, function(){ clearTimeout(lpTimer); lpTimer = null; }); });
  app.addEventListener('pointermove', function(e){ if (lpTimer && (Math.abs(e.clientX-lpX)>12 || Math.abs(e.clientY-lpY)>12)) { clearTimeout(lpTimer); lpTimer = null; } });
  app.addEventListener('contextmenu', function(e){ if (e.target.closest('[data-logo]')) e.preventDefault(); });

  /* --- Ciclo de vida de una prueba --- */
  function start(id){
    const pid = (data.cfg.pid||'').trim().toUpperCase();
    if (!pid) { msg('Escribe primero el ID del participante.'); const i = panel.querySelector('#s-pid'); if (i) i.focus(); return; }
    if (active) { msg('Cierra la prueba activa antes de iniciar otra.'); return; }
    // Condiciones previas para que la prueba sea posible
    if (id==='P1') { const t = task('t1'); if (t.status!=='todo') { t.status='todo'; t.checks=[false,false,false]; if (state.lastEvidence && state.lastEvidence.taskId==='t1') state.lastEvidence=null; } }
    if (id==='P2') resetIncident();
    if (id==='P4') { if (state.sup.verify) { if (state.sup.verify==='ok') state.sup.closed--; state.sup.toVerify++; state.sup.verify=null; } }
    if (id==='P5') state.sup.alert = 'new';
    state.role = TESTS[id].who==='Supervisor' ? 'supervisor' : 'worker';
    const prev = data.results[pid] && data.results[pid][id] ? JSON.parse(JSON.stringify(data.results[pid][id])) : null;
    active = {id:id, pid:pid, t0:null, tEnd:null, taps:0, errors:[], done:false, prev:prev};
    close();
    toRoot(rootEntry(), function(){ if (active) active.t0 = now(); updateDot(); });
    updateDot();
  }
  /* Fin automático: congela tiempo y toques y guarda un resultado provisorio con éxito = 1 */
  function detect(id, cond){
    if (!active || active.id!==id || active.done || !cond) return;
    active.done = true; active.tEnd = now();
    store(1, true);
    updateDot();
  }
  function store(exito, provisional){
    const a = active;
    const rec = {exito:exito, seg:r1(elapsed()), provisional:!!provisional};
    if (TESTS[a.id].full) { rec.toques = a.taps; rec.errores = a.errors.length; }
    rec.log = a.errors.slice();
    data.results[a.pid] = data.results[a.pid] || {};
    data.results[a.pid][a.id] = rec;
    data.results[a.pid]._ts = Date.now();
    save();
  }
  function finish(exito){
    if (!active) return;
    if (!active.done) { active.tEnd = now(); }
    store(exito, false);
    msg(active.id+' guardada para '+active.pid+': éxito '+fmtEx(exito)+' · '+fmt(elapsed())+' s.');
    active = null; updateDot(); render();
  }
  function discard(){
    if (!active) return;
    const a = active;
    if (a.done) {   // se había guardado un provisorio: restaurar el valor anterior
      if (a.prev) data.results[a.pid][a.id] = a.prev; else if (data.results[a.pid]) delete data.results[a.pid][a.id];
      if (data.results[a.pid] && Object.keys(data.results[a.pid]).filter(function(k){ return k!=='_ts'; }).length===0) delete data.results[a.pid];
      save();
    }
    active = null; updateDot(); msg('Prueba descartada.'); render();
  }
  function addError(){
    if (!active) return;
    active.errors.push({src:'manual', screen:screenLabel(), act:'+1 error (encuestador)', t:r1(elapsed())});
    if (active.done) store(1, true);
    render();
  }
  function updateDot(){
    dot.className = active ? ('on' + (active.done ? ' done' : '')) : '';
  }

  /* --- Exportación CSV --- */
  function pids(){ return Object.keys(data.results); }
  function csv(){
    const q = function(v){ v = v==null ? '' : String(v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const lines = [COLS.join(',')];
    pids().forEach(function(pid){
      const r = data.results[pid];
      const g = function(t,f){ return r[t] && r[t][f]!=null ? r[t][f] : ''; };
      lines.push([pid, 1,
        g('P1','exito'), g('P1','seg'), g('P1','toques'), g('P1','errores'),
        g('P2','exito'), g('P2','seg'), g('P2','toques'), g('P2','errores'),
        g('P3','exito'), g('P3','seg'), g('P4','exito'), g('P4','seg'), g('P5','exito'), g('P5','seg')
      ].map(q).join(','));
    });
    return lines.join('\r\n') + '\r\n';
  }
  function csvErrors(){
    const q = function(v){ v = v==null ? '' : String(v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const lines = ['ID,prueba,origen,pantalla,elemento,seg'];
    pids().forEach(function(pid){
      ['P1','P2','P3','P4','P5'].forEach(function(t){
        const r = data.results[pid][t];
        (r && r.log || []).forEach(function(e){ lines.push([pid,t,e.src==='auto'?'automatico':'encuestador',e.screen,e.act,e.t].map(q).join(',')); });
      });
    });
    return lines.join('\r\n') + '\r\n';
  }
  function stamp(){ const d=new Date(), p=function(n){ return String(n).padStart(2,'0'); }; return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes()); }
  function download(name, text){
    try {
      const blob = new Blob([text], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
      msg('Descarga iniciada: '+name);
    } catch(e){ msg('No se pudo descargar. Usa "Copiar al portapapeles".'); }
  }
  function copy(text){
    const fallback = function(){
      const ta = panel.querySelector('#s-csv');
      ta.hidden = false; ta.value = text; ta.readOnly = false; ta.focus(); ta.select();
      try { ta.setSelectionRange(0, text.length); } catch(e){}
      let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
      ta.readOnly = true;
      msg(ok ? 'CSV copiado. Pégalo en la planilla.' : 'Mantén presionado el texto de abajo y elige Copiar.');
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function(){ msg('CSV copiado. Pégalo en la planilla.'); }, fallback);
    } else fallback();
  }

  /* --- Reinicio del prototipo (no borra resultados) --- */
  function applyRole(role){
    if (role==='supervisor') { state.role = 'supervisor'; }
    else { state.role = 'worker'; if (role==='worker-tasks') { state.consented = true; state.consentChecked = true; } else { state.consented = false; state.consentChecked = false; } }
  }
  function resetPrototype(){
    if (active) discard();
    state = defaultState();
    applyRole(data.cfg.role);
    data.cfg.pid = ''; save();
    toRoot(rootEntry());
    msg('Prototipo reiniciado. Escribe el ID del siguiente participante.');
    render();
    const i = panel.querySelector('#s-pid'); if (i) i.focus();
  }

  /* --- Botones de dos toques (confirmación sin confirm()) --- */
  function twoStep(key, el, label, fn){
    if (armed[key]) { clearTimeout(armed[key]); armed[key] = null; fn(); return; }
    el.textContent = label;
    armed[key] = setTimeout(function(){ armed[key] = null; render(); }, 4000);
  }

  /* --- Interfaz del panel --- */
  function msg(t){ const m = panel.querySelector('#s-msg'); if (m) m.textContent = t; else pendingMsg = t; }
  let pendingMsg = '';
  function open(){
    if (isOpen) return;
    isOpen = true; panel.hidden = false; render();
    if (pendingMsg) { msg(pendingMsg); pendingMsg = ''; }
    clearInterval(ticker);
    ticker = setInterval(tick, 200);
  }
  function close(){
    isOpen = false; panel.hidden = true; clearInterval(ticker);
  }
  function tick(){
    if (!active) return;
    const t = panel.querySelector('#s-time'); if (t) t.textContent = fmt(elapsed());
  }
  function savedLine(pid, id){
    const r = data.results[pid] && data.results[pid][id]; if (!r) return '';
    let s = 'Guardado: éxito '+fmtEx(r.exito)+' · '+fmt(r.seg)+' s';
    if (r.toques!=null) s += ' · '+r.toques+' toques · '+r.errores+' errores';
    if (r.provisional) s += ' (provisorio)';
    return '<div class="saved-v">'+s+'</div>';
  }
  function renderTests(){
    const pid = (data.cfg.pid||'').trim().toUpperCase();
    return Object.keys(TESTS).map(function(id){
      const T = TESTS[id];
      return '<div class="test"><div class="tx"><b>'+id+' · '+T.who+'</b> <span class="tag">'+(T.auto?'fin automático':'cierre manual')+'</span><p>"'+esc(T.text)+'"</p>'+(pid?savedLine(pid,id):'')+'</div>'+
        '<button class="sbtn pri'+((active||!pid)?' dim':'')+'" data-s="start" data-arg="'+id+'">Iniciar</button></div>';
    }).join('');
  }
  function renderResults(){
    const ids = pids();
    if (!ids.length) return '<p class="muted">Todavía no hay resultados guardados.</p>';
    const cell = function(r,t){ return r[t] ? fmtEx(r[t].exito)+(r[t].provisional?'*':'') : '–'; };
    return '<table><thead><tr><th>ID</th><th>P1</th><th>P2</th><th>P3</th><th>P4</th><th>P5</th></tr></thead><tbody>'+
      ids.map(function(pid){ const r = data.results[pid]; return '<tr><td>'+esc(pid)+'</td><td>'+cell(r,'P1')+'</td><td>'+cell(r,'P2')+'</td><td>'+cell(r,'P3')+'</td><td>'+cell(r,'P4')+'</td><td>'+cell(r,'P5')+'</td></tr>'; }).join('')+
      '</tbody></table><p class="muted" style="margin-top:6px">'+ids.length+' participante(s). * = fin detectado, falta confirmar.</p>';
  }
  function renderActive(){
    if (!active) return '';
    const a = active;
    const log = a.errors.length ? '<ol class="log">'+a.errors.map(function(e){ return '<li>'+(e.src==='auto'?'Auto':'Manual')+' · '+esc(e.screen)+' · '+esc(e.act)+' · '+fmt(e.t)+' s</li>'; }).join('')+'</ol>' : '';
    return '<h3>Prueba activa</h3><div class="box">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:17px">'+a.id+' · '+esc(a.pid)+'</b><span class="tag'+(a.done?' done':'')+'">'+(a.done?'Fin detectado':'En curso')+'</span></div>'+
      '<p class="muted" style="margin-top:4px">"'+esc(TESTS[a.id].text)+'"</p>'+
      '<div class="live"><div><b id="s-time">'+fmt(elapsed())+'</b><span>segundos</span></div><div><b>'+a.taps+'</b><span>toques</span></div><div><b>'+a.errors.length+'</b><span>errores</span></div></div>'+
      '<button class="sbtn full" data-s="err">+1 error (guarda: '+esc(screenLabel())+')</button>'+
      log+
      '<p class="muted" style="margin:12px 0 6px">Cerrar con resultado'+(a.done?' (se propone 1)':'')+':</p>'+
      '<div class="row">'+
        '<button class="sbtn '+(a.done?'go':'')+'" data-s="fin" data-arg="1">1 = solo</button>'+
        '<button class="sbtn" data-s="fin" data-arg="0.5">0,5 = con ayuda</button>'+
        '<button class="sbtn" data-s="fin" data-arg="0">0 = no lo logró</button>'+
      '</div>'+
      '<button class="sbtn full" style="margin-top:8px;background:transparent" data-s="discard">Descartar prueba (no guardar)</button>'+
    '</div>';
  }
  function render(){
    const pid = data.cfg.pid || '';
    panel.innerHTML = '<div class="wrap">'+
      '<div class="shead"><h2>Modo encuestador</h2><button class="sbtn" data-s="close" aria-label="Cerrar panel">'+icon('x',20)+' Cerrar</button></div>'+
      '<p class="muted">'+(storageOK?'Resultados guardados en este celular.':'No se pudo usar el almacenamiento: los resultados quedan solo en memoria. Exporta antes de cerrar la página.')+'</p>'+
      '<p class="muted" id="s-env"'+(launchMode()!=='app' && IS_IOS || launchMode()==='file' ? ' style="color:#F2B705"' : '')+'>'+envHTML()+'</p>'+
      '<div class="msg" id="s-msg" role="status" aria-live="polite"></div>'+
      renderActive()+
      '<h3>Participante</h3>'+
      '<input type="text" id="s-pid" value="'+esc(pid)+'" placeholder="Ej.: T03" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="ID del participante">'+
      '<h3>Rol inicial</h3>'+
      '<div class="row" style="flex-direction:column">'+ROLES.map(function(r){ return '<button class="sbtn" data-s="role" data-arg="'+r[0]+'" aria-pressed="'+(data.cfg.role===r[0])+'">'+r[1]+'</button>'; }).join('')+'</div>'+
      '<h3>Pruebas</h3><div class="box" id="s-tests">'+renderTests()+'</div>'+
      '<h3>Resultados</h3><div class="box">'+renderResults()+
        '<div class="row" style="margin-top:10px"><button class="sbtn pri" data-s="csv">Descargar CSV</button><button class="sbtn" data-s="copy">Copiar al portapapeles</button></div>'+
        '<button class="sbtn full" style="margin-top:8px" data-s="csv-err">Descargar detalle de errores (CSV)</button>'+
        '<textarea id="s-csv" readonly hidden aria-label="Texto CSV"></textarea>'+
        '<button class="sbtn full bad" style="margin-top:8px" data-s="wipe">Borrar todos los resultados</button>'+
      '</div>'+
      '<h3>Entre participantes</h3><div class="box">'+
        '<p class="muted" style="margin-bottom:8px">Vuelve todo al estado inicial (tareas, casillas, banner e incidentes). No borra los resultados guardados.</p>'+
        '<button class="sbtn full pri" data-s="reset">Reiniciar prototipo</button>'+
      '</div>'+
    '</div>';
  }
  panel.addEventListener('click', function(e){
    const b = e.target.closest('[data-s]'); if (!b) return;
    const a = b.dataset.s, arg = b.dataset.arg;
    if (a==='close') close();
    else if (a==='start') start(arg);
    else if (a==='err') addError();
    else if (a==='fin') finish(parseFloat(arg));
    else if (a==='discard') discard();
    else if (a==='role') {
      if (active) { msg('Cierra la prueba activa antes de cambiar el rol.'); return; }
      data.cfg.role = arg; save(); applyRole(arg); toRoot(rootEntry()); render(); msg('Rol aplicado: '+b.textContent+'.');
    }
    else if (a==='csv') { if (!pids().length) { msg('No hay resultados para exportar.'); return; } download('sito_resultados_'+stamp()+'.csv', csv()); }
    else if (a==='csv-err') download('sito_errores_'+stamp()+'.csv', csvErrors());
    else if (a==='copy') { if (!pids().length) { msg('No hay resultados para copiar.'); return; } copy(csv()); }
    else if (a==='wipe') twoStep('wipe', b, 'Toca otra vez para borrar TODO', function(){ data.results = {}; save(); render(); msg('Resultados borrados.'); });
    else if (a==='reset') twoStep('reset', b, 'Toca otra vez para reiniciar', resetPrototype);
  });
  panel.addEventListener('input', function(e){
    if (e.target.id!=='s-pid') return;
    data.cfg.pid = e.target.value.trim().toUpperCase(); save();
    const box = panel.querySelector('#s-tests'); if (box) box.innerHTML = renderTests();
  });
  document.addEventListener('keydown', function(e){ if (isOpen && e.key==='Escape') close(); });

  load();
  requestPersist();
  return {
    open:open, detect:detect,
    initialRole:function(){ applyRole(data.cfg.role); },
    /* Solo para pruebas automatizadas */
    _debug:function(){ return {active:active, data:data}; }
  };
})();

   H. Arranque
   ========================================================= */
survey.initialRole();
(function boot(){
  const r = rootEntry();
  const entry = {screen:r.screen, params:{}, idx:0};
  nav.stack = [entry];
  pushHist(entry, true);
